name: Sync redirects to hewonjeong.github.io

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/build-redirects.ts'
      - '.github/workflows/deploy-redirects.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Generate redirect HTML
        run: bun scripts/build-redirects.ts
      - name: Push to redirect repo
        env:
          PAT: ${{ secrets.REDIRECT_REPO_PAT }}
          SHA: ${{ github.sha }}
        run: |
          cd redirect-build
          git init -q -b main
          git -c user.email=actions@github.com -c user.name="GitHub Actions" \
            add . && git -c user.email=actions@github.com -c user.name="GitHub Actions" \
            commit -q -m "chore: sync redirects from ${SHA::7}"
          git push -f "https://x-access-token:${PAT}@github.com/hewonjeong/hewonjeong.github.io.git" main
